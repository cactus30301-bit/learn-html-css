    <h1>하이퍼링크 앵커 복습</h1>
    <h2>텍스트 링크</h2>
    <!-- 각 줄 마다 p태그 : ctrl alt w : p* -->
    <p><a href="https://bootcamp.likelion.net/" title="멋쟁이 사자처럼 부트캠프 메인으로 이동합니다." target="_blank" rel="noopener noreferrer">멋쟁이 사자처럼 부트캠프</a></p>
    <p><a href="https://github.com/seulbinim" title="깃허브 메인 화면으로 이동합니다." target="_blank" rel="noopener noreferrer">Github</a></p>
    <p><a href="https://naver.com" title="네이버로 이동합니다." target="_blank" rel="noopener noreferrer">Naver</a></p>
    <!-- 앵커 태그 사용 > 절대 경로 > 이후 꺽쇠 밖에 링크를 담을 텍스트 입력.  -->
    <!-- 주소 옆에 title(마우스오버시 툴팁문구), target(열리게 될 탭), rel="noopener noreferrer" -->
    <h2>텍스트 링크 + a</h2>
    <!-- 다운로드 링크는 주소 쓰고 download만 입력 -->
    <p><a href="/src/assets/pdf/google-seo-guide-ko.pdf" download>구글 SEO 가이드 download</a></p>
    <!-- mailto:, tel: -->
    <!-- 메일 보내기 링크, 뒤에 ?subject=문의사항 은 선택사항 -->
    <p><a href="mailto:cactus30301@gmail.com?subject=문의사항">김효경에게 메일 보내기 mailto:</a></p>
    <!-- tel:은 핸드폰에서 바로 전화걸기로 연결됨 -->
    <p><a href="tel:01012345678">010-1234-5678 tel:</a></p>

 <!-- figcaption : figure 안의 콘텐츠에 대한 설명(캡션)을 제공하는 태그 -->

      </figcaption>
    </figure>
