<!doctype html>
<html lang="ko-KR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>아바타 UI</title>
    <link rel="shortcut icon" href="/favicon/likelion.ico" type="image/x-icon" />
    <link rel="icon" href="/favicon/likelion.svg" type="image/svg" />
    <link rel="preload" as="font" href="/font/suit/SUIT-Variable.woff2" />
    <link rel="stylesheet" href="/font/suit/SUIT-Variable.css" />
    <link rel="stylesheet" href="/src/common/index.css" />
    <link rel="stylesheet" href="/src/ui/avatars/p-avatars.css" />
    <script type="module" src="/src/ui/js/copy-component.js"></script>
  </head>
  <body class="spacing-20">
    <a href="/index.html">Index로 이동</a>
    <h1>아바타 UI 복습</h1>

    <h2>오프라인</h2>
    <div class="avatarcpnt">
      <img src="/src/assets/face/jackman.jpg" width="64" height="64" alt="아바타이름" />
      <span class="avatarstate"><span class="sr-only">오프라인</span></span>
    </div>

    <h2>온라인</h2>
    <div class="avatarcpnt">
      <img src="/src/assets/face/jackman.jpg" width="64" height="64" alt="아바타이름" />
      <span class="avatarstate on-line"><span class="sr-only">온라인</span></span>
    </div>
    <!-- botton & Aria -->
    <h2>오프라인 with button for div</h2>
    <button type="button" class="avatarcpnt">
      <img src="/src/assets/face/jackman.jpg" width="64" height="64" alt="아바타이름" />
      <span class="avatarstate"><span class="sr-only">오프라인</span></span>
    </button>

    <h2>온라인 with (botton & Aria) for (div & sr-only)</h2>
    <button type="button" class="avatarcpnt" aria-label="온라인">
      <img src="/src/assets/face/jackman.jpg" width="64" height="64" alt="아바타이름" />
      <span class="avatarstate on-line"></span>
      <!-- <span class="avatarstate on-line"><span class="sr-only">온라인</span></span> -->
      <!-- aria-label이 ScreenReader역할을 sr-only span 대신 하는 중이라 주석 처리함 -->
    </button>
  </body>
</html>
